<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oportunidades — Cora × Conta Junto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4F8;
    --panel:#FFFFFF;
    --panel-2:#FCFCFE;
    --border-color:#E4E7EE;
    --line:#E7E9F0;
    --text-primary:#171A22;
    --text-secondary:#667085;
    --ink:#171A22;
    --cora:#E31C56;
    --cora-soft:rgba(227,28,86,.10);
    --cj:#3654E0;
    --cj-soft:rgba(54,84,224,.10);
    --green:#16A34A;
    --rust:#DC5B2E;
    --slate:#64748B;
    --blue:#2E86D6;
    --blue-soft:rgba(46,134,214,.12);
    --maroon:#9C2F56;

    /* spacing scale — used consistently everywhere below */
    --space-2xs: 8px;
    --space-xs:  12px;
    --space-sm:  16px;
    --space-md:  20px;
    --space-lg:  28px;
    --space-xl:  36px;

    /* radii */
    --radius-sm: 12px;
    --radius-md: 16px;

    /* type scale — px-based and predictable, never smaller than 13px */
    --font-xs:   13px;
    --font-sm:   14.5px;
    --font-base: 16px;
    --font-md:   19px;
    --font-lg:   26px;
    --font-xl:   32px;
    --font-hero: clamp(38px, 6vw, 54px);

    --shadow-card: 0 2px 14px -4px rgba(23,26,34,.10);
    --content-max: 1760px;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; height:100%; }
  html, body{ height:100%; margin:0; overflow:hidden; }
  body{
    background:
      radial-gradient(ellipse 1200px 700px at 12% -10%, rgba(227,28,86,.05), transparent 60%),
      radial-gradient(ellipse 900px 600px at 105% 10%, rgba(54,84,224,.06), transparent 55%),
      var(--bg);
    color:var(--text-primary);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .dashboard{
    max-width:var(--content-max);
    height:100vh;
    margin:0 auto;
    padding: clamp(14px, 1.8vh, 24px) clamp(20px, 3vw, 40px);
    display:flex;
    flex-direction:column;
    gap: clamp(10px, 1.4vh, 18px);
    overflow:hidden;
  }

  /* ---------------- HEADER ---------------- */
  header{ flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--space-md); }
  .brand{ display:flex; align-items:center; gap:var(--space-sm); min-width:0; }
  .brand .glyph{
    width:48px; height:48px; min-width:48px; border-radius:22%;
    background:linear-gradient(155deg, var(--cora), #B0143F);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    font-family:'Fraunces', serif; font-weight:600; color:#fff; font-size:var(--font-md);
    box-shadow:0 6px 18px -6px rgba(227,28,86,.35);
  }
  .brand .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); letter-spacing:.13em; text-transform:uppercase; color:var(--text-secondary); font-weight:600; line-height:1.5; }
  .brand h1{ font-family:'Fraunces', serif; font-weight:600; font-size:clamp(24px, 3vw, 34px); margin:4px 0 0; letter-spacing:-0.01em; line-height:1.25; }
  .brand h1 em{ color:var(--cora); font-style:italic; font-weight:500; }

  .headright{ display:flex; align-items:center; gap:var(--space-md); flex-shrink:0; }
  .clock{ text-align:right; font-family:'IBM Plex Mono', monospace; line-height:1.4; }
  .clock .time{ font-size:var(--font-lg); font-weight:600; letter-spacing:.02em; }

  /* ---------------- STATUS STRIP ---------------- */
  .status-strip{ flex:0 0 auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:var(--space-sm); }
  .status-tile{
    background:linear-gradient(175deg, var(--panel), var(--panel-2));
    border:1px solid var(--border-color); border-top:3px solid var(--tc, var(--slate));
    border-radius:var(--radius-sm); padding:var(--space-xs) var(--space-sm);
    display:flex; flex-direction:column; gap:6px; min-width:0;
    box-shadow:var(--shadow-card);
  }
  .status-tile .lbl{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); text-transform:uppercase; letter-spacing:.04em; color:var(--text-secondary); font-weight:600; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status-tile .row{ display:flex; align-items:baseline; gap:10px; }
  .status-tile .num{ font-family:'Fraunces', serif; font-weight:700; font-size:var(--font-lg); line-height:1; color:var(--tc, var(--ink)); }
  .status-tile .pct{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); color:var(--text-secondary); font-weight:600; }

  /* ---------------- MAIN GRID ---------------- */
  main{ flex:1 1 auto; min-height:0; display:grid; grid-template-columns: minmax(340px, 1.05fr) minmax(340px, .95fr); gap:var(--space-md); align-items:stretch; }

  .panel{
    background:linear-gradient(175deg, var(--panel), var(--panel-2));
    border:1px solid var(--border-color); border-radius:var(--radius-md); padding:var(--space-md);
    box-shadow:var(--shadow-card);
    min-height:0; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .panel-title{
    font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); text-transform:uppercase; letter-spacing:.08em;
    color:var(--text-secondary); font-weight:600; margin:0 0 var(--space-sm); flex:0 0 auto;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px var(--space-sm);
    line-height:1.5;
  }
  .panel-title > *{ min-width:0; overflow-wrap:break-word; }
  .panel-title b{ color:var(--ink); font-weight:700; }

  /* ---- donut panel ---- */
  .donut-panel{ flex-direction:row; flex-wrap:wrap; align-items:center; gap:var(--space-lg); overflow-y:auto; }
  .donut-wrap{ position:relative; width:min(200px, 22vh); height:min(200px, 22vh); min-width:130px; min-height:130px; flex-shrink:0; margin:0 auto; }
  .donut-wrap svg circle{ transition: stroke-dasharray .6s ease, stroke-dashoffset .6s ease; }
  .donut-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:var(--space-xs); overflow:hidden; }
  .donut-center .n{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(28px, 4vh, var(--font-hero)); color:var(--cj); line-height:1; }
  .donut-center .l{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); color:var(--text-secondary); margin-top:6px; letter-spacing:.03em; line-height:1.3; }
  .donut-center .v{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-sm); color:var(--ink); font-weight:700; margin-top:6px; }

  .legend-col{ display:flex; flex-direction:column; gap:var(--space-xs); justify-content:center; min-width:220px; flex:1; min-height:0; }
  .legend-row{ display:flex; align-items:center; gap:var(--space-sm); }
  .legend-row .sw{ width:14px; height:14px; border-radius:4px; flex-shrink:0; }
  .legend-row .txt{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .legend-row .lname{ font-size:var(--font-md); font-weight:600; line-height:1.35; }
  .legend-row .lsub{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); color:var(--text-secondary); line-height:1.5; }
  .legend-row .lval{ margin-left:auto; padding-left:var(--space-md); font-family:'IBM Plex Mono', monospace; font-size:var(--font-lg); font-weight:700; flex-shrink:0; }
  .legend-row.opp .lval{ color:var(--cj); }
  .legend-row.opp .lname{ color:var(--cj); }

  /* ---- stats column ---- */
  .stats-col{ display:flex; flex-direction:column; gap:var(--space-sm); min-width:0; min-height:0; height:100%; }
  .kpi-duo{ flex:0 0 auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:var(--space-sm); }
  .kpi-tile{
    background:linear-gradient(175deg, var(--panel), var(--panel-2)); border:1px solid var(--border-color); border-radius:var(--radius-md);
    padding:var(--space-sm) var(--space-md); display:flex; flex-direction:column; justify-content:center; gap:6px;
    box-shadow:var(--shadow-card); min-width:0;
  }
  .kpi-tile .lbl{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary); font-weight:600; line-height:1.4; }
  .kpi-tile .val{ font-family:'Fraunces', serif; font-weight:700; font-size:var(--font-xl); line-height:1.2; color:var(--cj); word-break:break-word; }
  .kpi-tile .val small{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-md); font-weight:600; color:var(--text-secondary); margin-left:6px; }
  .kpi-tile.alt .val{ color:var(--cora); }

  .bar-panel{ flex:1 1 0; min-height:0; }
  .hbar-row{ display:grid; grid-template-columns: minmax(90px, 160px) 1fr auto; align-items:center; gap:var(--space-sm); padding:6px 0; }
  .hbar-label{ font-size:var(--font-base); font-weight:600; line-height:1.4; }
  .hbar-track{ height:10px; background:var(--line); border-radius:99px; overflow:hidden; }
  .hbar-fill{ height:100%; border-radius:99px; transition:width .5s ease; }
  .hbar-val{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-base); font-weight:700; text-align:right; white-space:nowrap; line-height:1.4; }
  .hbar-val .sub{ color:var(--text-secondary); font-weight:500; font-size:var(--font-xs); display:block; margin-top:2px; }

  /* ---- single-status rotator (Oportunidades por status) ---- */
  #statusSingle{ flex:1; display:flex; flex-direction:column; gap:var(--space-sm); min-height:0; justify-content:center; overflow:hidden; }
  #statusSingle .ss-header{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  #statusSingle .ss-dot{ width:12px; height:12px; border-radius:4px; flex-shrink:0; }
  #statusSingle .ss-name{ font-size:var(--font-md); font-weight:700; line-height:1.3; min-width:0; }
  #statusSingle .ss-count-badge{ margin-left:auto; font-family:'Fraunces', serif; font-weight:700; font-size:var(--font-lg); line-height:1; flex-shrink:0; }

  .ss-bullets{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .ss-bullet{ display:flex; align-items:flex-start; gap:10px; min-width:0; }
  .ss-bullet .marker{ width:8px; height:8px; border-radius:50%; margin-top:.5em; flex-shrink:0; }
  .ss-bullet .content{ display:flex; flex-direction:column; gap:3px; min-width:0; flex:1; }
  .ss-bullet .k{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary); font-weight:600; line-height:1.3; }
  .ss-bullet .v{ font-size:var(--font-sm); font-weight:600; line-height:1.4; overflow-wrap:break-word; }
  .ss-bullet .v.ss-def-text{
    font-size:var(--font-xs); font-weight:400; color:var(--text-secondary); line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* ---------------- CAROUSEL STRIP ---------------- */
  .carousel-panel{ flex:0 0 auto; }
  .carousel-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px var(--space-md); margin-bottom:8px; }
  .carousel-head .panel-title{ margin-bottom:0; flex:1; min-width:0; }
  .rot-dots{ display:flex; gap:6px; align-items:center; }
  .rot-dots .d{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:.2s; }
  .rot-dots .d.active{ background:var(--cj); width:20px; border-radius:4px; }
  .rot-counter{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); color:var(--text-secondary); font-weight:600; letter-spacing:.04em; white-space:nowrap; }
  .rot-track{ width:70px; height:2px; background:var(--line); border-radius:2px; overflow:hidden; margin-left:var(--space-sm); flex-shrink:0; }
  .rot-track.wide{ width:120px; }
  .rot-bar{ height:100%; width:0%; background:var(--cj); }
  .rot-bar.animate{ transition:width linear; }

  .card-grid{ display:flex; align-items:center; justify-content:center; min-height:15vh; max-height:26vh; overflow-y:auto; padding:4px 0; }
  .client-spotlight{ width:100%; max-width:760px; margin:0 auto; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; animation:fadeIn .4s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .client-spotlight .cs-top{ display:flex; align-items:center; justify-content:center; gap:var(--space-sm); flex-wrap:wrap; }
  .client-spotlight .cs-name{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(20px, 3.4vh, 38px); line-height:1.25; color:var(--ink); word-break:break-word; }
  .client-spotlight .cs-cnpj{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-sm); color:var(--text-secondary); letter-spacing:.03em; }
  .client-spotlight .cs-meta{ display:flex; flex-wrap:wrap; justify-content:center; gap:var(--space-xl); margin-top:6px; padding-top:10px; border-top:1px solid var(--border-color); width:100%; max-width:520px; }
  .client-spotlight .cs-meta-item{ display:flex; flex-direction:column; align-items:center; gap:4px; min-width:150px; }
  .client-spotlight .cs-meta-item .k{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary); font-weight:600; }
  .client-spotlight .cs-meta-item .v{ font-family:'Fraunces', serif; font-weight:700; font-size:var(--font-xl); color:var(--ink); }
  .client-spotlight .cs-meta-item .v.gold{ color:var(--cj); }

  .pill{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); font-weight:700; padding:4px 11px; border-radius:99px; white-space:nowrap; flex-shrink:0; }
  .pill.INACTIVE{ background:var(--cj-soft); color:var(--cj); }
  .pill.WAITING_REGISTRATION{ background:var(--cora-soft); color:var(--cora); }
  .pill.WAITING_ANALYSIS{ background:var(--blue-soft); color:var(--blue); }
  .type-badge{ font-family:'IBM Plex Mono', monospace; font-size:var(--font-xs); font-weight:700; padding:3px 9px; border-radius:6px; background:rgba(23,26,34,.06); color:var(--text-secondary); }

  .empty-note{ display:flex; align-items:center; justify-content:center; min-height:100px; color:var(--text-secondary); font-size:var(--font-md); font-family:'IBM Plex Mono', monospace; text-align:center; padding:var(--space-md); line-height:1.5; }

  /* ---------------- RESPONSIVE ---------------- */
  @media (max-width: 1100px){
    main{ grid-template-columns:1fr; }
  }
  @media (max-width: 900px), (max-height: 620px){
    html, body{ height:auto; overflow:auto; }
    .dashboard{ height:auto; overflow:visible; }
    main{ min-height:0; }
    .panel{ overflow:visible; }
    #statusSingle, .donut-panel, .card-grid{ overflow:visible; max-height:none; }
    .bar-panel{ flex:none; }
  }
  @media (max-width: 640px){
    .dashboard{ padding: var(--space-sm) var(--space-sm) var(--space-md); gap:var(--space-sm); }
    .status-strip{ grid-template-columns:repeat(2, 1fr); }
    .kpi-duo{ grid-template-columns:1fr; }
    .headright{ width:100%; justify-content:flex-end; }
    .donut-panel{ justify-content:center; }
  }
</style>
</head>
<body>
  <div class="dashboard">

    <header>
      <div class="brand">
        <div class="glyph">C</div>
        <div>
          <div class="eyebrow">Painel de parceria · Programa de indicação</div>
          <h1>Oportunidades <em>Cora × Conta Junto</em></h1>
        </div>
      </div>
      <div class="headright">
        <div class="clock">
          <div class="time" id="clockTime">--:--</div>
        </div>
      </div>
    </header>

    <div class="status-strip" id="statusStrip"></div>

    <main>
      <div class="panel donut-panel">
        <div class="donut-wrap" id="donutWrap"></div>
        <div class="legend-col" id="legendCol"></div>
      </div>

      <div class="stats-col">
        <div class="kpi-duo">
          <div class="kpi-tile">
            <div class="lbl">Oportunidades abertas</div>
            <div class="val" id="kpiOppCount">—</div>
          </div>
          <div class="kpi-tile alt">
            <div class="lbl">Potencial de comissão (equipe)</div>
            <div class="val" id="kpiOppValue">—</div>
          </div>
        </div>
        <div class="panel bar-panel">
          <div class="carousel-head">
            <div class="panel-title" style="margin-bottom:0;">Oportunidades por status</div>
            <div style="display:flex; align-items:center;">
              <div class="rot-dots" id="statusRotDots"></div>
              <div class="rot-track"><div class="rot-bar" id="statusRotBar"></div></div>
            </div>
          </div>
          <div id="statusSingle"></div>
        </div>
      </div>
    </main>

    <section class="panel carousel-panel">
      <div class="carousel-head">
        <div class="panel-title">Clientes em oportunidade — maior potencial primeiro</div>
        <div style="display:flex; align-items:center;">
          <div class="rot-dots" id="rotDots"></div>
          <div class="rot-track wide"><div class="rot-bar" id="rotBar"></div></div>
        </div>
      </div>
      <div class="card-grid" id="cardGrid"></div>
    </section>

  </div>

function renderStatusStrip(clients){

  document.getElementById('statusStrip').innerHTML = STATUS_ORDER.map(s => {

    const color = STATUS_COLOR[s];
    return `
    <div class="status-tile" style="--tc:${color}">
      <div class="lbl">${STATUS_LABEL[s]}</div>
      <div class="row"><span class="num">${n}</span><span class="pct">${pct}%</span></div>
    </div>`;
  }).join('');
}

/* ===================== CSV PARSE (mesma lógica do painel anterior) ===================== */
function parseCSV(text){
  const rows = []; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(inQ){
      if(c==='"' && n==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){}
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r.length===1 && r[0]!==''));
}
function csvToClients(csvText){
  const rows = parseCSV(csvText);
  if(!rows.length) throw new Error('Planilha vazia');
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = {
    date:header.indexOf('referred_at'), cnpj:header.indexOf('indicado_cnpj'), name:header.indexOf('indicado_company_name'),
    type:header.indexOf('account_type'), status:header.indexOf('indicado_status'),
    commMonth:header.indexOf('commission_month'), amount:header.indexOf('amount_reais')
  };
  if(idx.cnpj===-1 || idx.status===-1) throw new Error('Colunas não encontradas');
  const dateOnly = v => { const m=(v||'').match(/^(\d{4}-\d{2}-\d{2})/); return m?m[1]:((v||'').trim()||null); };
  return rows.slice(1).filter(r=>r[idx.cnpj] && r[idx.cnpj].trim()).map(r => ({
    date: dateOnly(r[idx.date]),
    cnpj: (r[idx.cnpj]||'').trim(),
    name: (r[idx.name]||'').trim() || null,
    type: (r[idx.type]||'UNKNOWN').trim().toUpperCase() || 'UNKNOWN',
    status: (r[idx.status]||'').trim().toUpperCase(),
    amount: r[idx.amount] && r[idx.amount].trim()!=='' ? Math.round(parseFloat(r[idx.amount].replace(',','.'))) : null,
  })).filter(c=>c.status);
}

/* ===================== DONUT CHART ===================== */
function renderDonut(segments){
  const size=280, thickness=40, gap=10;
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  const r = (size-thickness)/2, c = 2*Math.PI*r, cx=size/2, cy=size/2;
  let cursor=0;
  const circles = segments.map(s => {
    const raw = (s.value/total)*c;
    const len = Math.max(0, raw-gap);
    const dashoffset = -(cursor + gap/2);
    cursor += raw;
    const glow = s.emph ? `filter:drop-shadow(0 0 6px ${s.color}88);` : '';
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${s.emph?thickness+6:thickness}"
      stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 ${cx} ${cy})" style="${glow}" />`;
  }).join('');
  document.getElementById('donutWrap').innerHTML = `
    <svg viewBox="0 0 ${size} ${size}" width="100%" height="100%">${circles}</svg>
    <div class="donut-center">
      <div class="n" id="donutN">0</div>
      <div class="l">oportunidades abertas</div>
      <div class="v" id="donutV">R$ 0/mês</div>
    </div>`;
}

/* ===================== BAR CHARTS ===================== */
function renderBars(containerId, items){
  const max = Math.max(1, ...items.map(i=>i.count));
  document.getElementById(containerId).innerHTML = items.map(i => `
    <div class="hbar-row">
      <div class="hbar-label">${i.label}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(i.count/max*100)}%; background:${i.color}"></div></div>
      <div class="hbar-val">${i.count}<span class="sub">${i.sub}</span></div>
    </div>`).join('') || `<div class="empty-note">Sem dados.</div>`;
}

/* ===================== CARD ROTATOR ===================== */
let cardItems = [];
let cardPage = 0;
let cardTimer = null;
function daysSince(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  return Math.max(0, Math.floor((Date.now()-d.getTime())/86400000));
}
function renderCardPage(){
  const totalItems = Math.max(1, cardItems.length);
  if(cardPage>=totalItems) cardPage=0;
  const grid = document.getElementById('cardGrid');
  if(!cardItems.length){
    grid.innerHTML = `<div class="empty-note">Nenhuma oportunidade aberta no momento — parabéns ao time! 🎉</div>`;
  } else {
    const c = cardItems[cardPage];
    const d = daysSince(c.date);
    const val = teamCommission(c.type);
    grid.innerHTML = `
      <div class="client-spotlight">
        <div class="cs-top">
          <span class="pill ${c.status}">${STATUS_LABEL[c.status]||c.status}</span>
          <span class="type-badge">${c.type}</span>
        </div>
        <div class="cs-name">${c.name || 'CNPJ '+cnpjFmt(c.cnpj)}</div>
        <div class="cs-cnpj">${cnpjFmt(c.cnpj)}</div>
        <div class="cs-meta">
          <div class="cs-meta-item">
            <span class="k">Aguardando há</span>
            <span class="v">${d!==null ? d+' dias' : '—'}</span>
          </div>
          <div class="cs-meta-item">
            <span class="k">Potencial de comissão</span>
            <span class="v gold">${val ? fmtBRL(val)+'/mês' : '—'}</span>
          </div>
        </div>
      </div>`;
  }
  // counter (nome + posição), no lugar dos pontinhos — mais legível com muitos clientes
  const dotsEl = document.getElementById('rotDots');
  dotsEl.innerHTML = cardItems.length
    ? `<span class="rot-counter">${String(cardPage+1).padStart(2,'0')} / ${String(totalItems).padStart(2,'0')}</span>`
    : '';
  // progress bar
  const bar = document.getElementById('rotBar');
  bar.classList.remove('animate'); bar.style.width='0%';
  void bar.offsetWidth;
  if(totalItems>1){
    bar.style.transitionDuration = CARD_ROTATE_MS+'ms';
    bar.classList.add('animate');
    requestAnimationFrame(()=>{ bar.style.width='100%'; });
  }
}
function startCardRotation(){
  if(cardTimer) clearInterval(cardTimer);
  cardTimer = setInterval(() => {
    const totalItems = Math.max(1, cardItems.length);
    if(totalItems<=1) return;
    cardPage = (cardPage+1) % totalItems;
    renderCardPage();
  }, CARD_ROTATE_MS);
}

    { cls:'opp', color:'#3654E0', name:'Oportunidade', sub:'inativo + aguardando cadastro/análise', n:oppClients.length },
    { cls:'', color:'#16A34A', name:'Ativo', sub:'gerando comissão', n:activeClients.length },
    { cls:'', color:'#DC5B2E', name:'Cliente Sem Movimento (30 dias)', sub:'ativou e parou de usar', n:churnClients.length },
    { cls:'', color:'#64748B', name:'Encerrado', sub:'expirado ou reprovado', n:closedClients.length },
  ];
  document.getElementById('legendCol').innerHTML = legendData.map(l => `
    <div class="legend-row ${l.cls}">
      <span class="sw" style="background:${l.color}"></span>
      <div class="txt"><span class="lname">${l.name}</span><span class="lsub">${l.sub}</span></div>
      <span class="lval">${l.n}</span>
    </div>`).join('');

  // status único rotacionando
  statusItems = OPPORTUNITY_STATUSES.map(s => {
    const items = byStatus[s]||[];
    const val = items.reduce((a,c)=>a+teamCommission(c.type),0);
    return { label:STATUS_LABEL[s], count:items.length, sub:fmtBRL(val)+'/mês', color:STATUS_COLOR[s], def:STATUS_DEF[s] };
  }).filter(s => s.count > 0);
  if(!statusItems.length){
    // se não houver nenhuma oportunidade aberta, mostra os três status zerados mesmo assim
    statusItems = OPPORTUNITY_STATUSES.map(s => ({ label:STATUS_LABEL[s], count:0, sub:'R$\u00A00/mês', color:STATUS_COLOR[s], def:STATUS_DEF[s] }));
  }
  statusIdx = 0;
  renderStatusSingle();
  startStatusRotation();

  // cards
  cardItems = [...oppClients].sort((a,b) => {
    const va=VALUE_BY_TYPE[a.type]||0, vb=VALUE_BY_TYPE[b.type]||0;
    if(vb!==va) return vb-va;
    return (a.date||'').localeCompare(b.date||'');
  });
  cardPage = 0;
  renderCardPage();
  startCardRotation();
}

/* ===================== CLOCK ===================== */
function tickClock(){
  const now = new Date();
  document.getElementById('clockTime').textContent = now.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}
tickClock();
setInterval(tickClock, 15000);

/* ===================== LIVE SYNC ===================== */
function setSync(state, msg){
  console.log(`[sync:${state}]`, msg);
}
let liveDataLoaded = false;
async function fetchLive(){
  setSync('loading', 'sincronizando…');
  let lastErr = null;
  for(const tabName of SHEET_TAB_CANDIDATES){
    try{
      const res = await fetch(GVIZ_URL(tabName), { cache:'no-store' });
      if(!res.ok) throw new Error('HTTP '+res.status+' (aba "'+tabName+'")');
      const text = await res.text();
      const clients = csvToClients(text);
      if(!clients.length) throw new Error('vazio (aba "'+tabName+'")');
      refreshDashboard(clients);
      liveDataLoaded = true;
      setSync('ok', `dados ao vivo · aba "${tabName}" · ${clients.length} registros · ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`);
      return;
    } catch(err){
      lastErr = err;
    }
  }
  console.error('Falha ao sincronizar com a planilha:', lastErr);
  if(!liveDataLoaded) refreshDashboard(SNAPSHOT_CLIENTS);
  const reason = (lastErr && lastErr.message) ? lastErr.message : 'erro desconhecido';
  setSync('err', `instantâneo salvo (${SNAPSHOT_CLIENTS.length} registros) — planilha indisponível: ${reason}`);
}

refreshDashboard(SNAPSHOT_CLIENTS);
fetchLive();
setInterval(fetchLive, AUTO_REFRESH_MS);
</script>
