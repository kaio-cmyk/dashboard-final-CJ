<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conta Junto — Rotação de Painéis</title>
<style>
  html, body{ margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#000; }
  .slide{
    position:fixed; inset:0; width:100%; height:100%; border:0; display:block;
    opacity:0; visibility:hidden; transition:opacity .6s ease;
  }
  .slide.active{ opacity:1; visibility:visible; }
</style>
</head>
<body>

  <!-- Painel 1: Oportunidades Cora x Conta Junto (aba [Coraliados]) -->
  <iframe class="slide active" id="slide-cora" src="dashboard-cora-conta-junto-refinado.html" title="Oportunidades Cora x Conta Junto"></iframe>

  <!-- Painel 2: Dashboard Operacional TV (abas tarefas / Metas e Acompanhamento) -->
  <iframe class="slide" id="slide-operacional" src="dashboard-operacional-tv.html" title="Dashboard Operacional Conta Junto"></iframe>

<script>
  // Troca de painel a cada 30 segundos.
  // Ambos os iframes ficam sempre carregados (mesmo quando ocultos), então
  // os timers internos de cada dashboard (relógio, atualização da planilha,
  // rotação de status/cliente) continuam rodando normalmente em segundo plano.
  const ROTATE_MS = 30000;
  const slides = [
    document.getElementById('slide-cora'),
    document.getElementById('slide-operacional'),
  ];
  let current = 0;

  function showSlide(index){
    slides.forEach((el, i) => el.classList.toggle('active', i === index));
  }

  setInterval(() => {
    current = (current + 1) % slides.length;
    showSlide(current);
  }, ROTATE_MS);
</script>
</body>
</html>
